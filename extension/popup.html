<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>VidGrab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="video">
  <div class="busy" id="busy" hidden>Обновляю yt-dlp, это несколько секунд</div>

  <section class="media" id="media" aria-busy="true">
    <div class="thumb" id="thumb">
      <img id="thumbImg" alt="" referrerpolicy="no-referrer" hidden>
      <span class="dur" id="dur" hidden></span>
    </div>
    <div class="meta">
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
  </section>

  <section class="notice" id="notice" hidden>
    <h2 id="noticeTitle"></h2>
    <p id="noticeText"></p>
    <button class="ghost" id="noticeBtn" type="button" hidden></button>
  </section>

  <section class="picker" id="picker" hidden>
    <div class="modes" role="tablist" aria-label="Что скачать">
      <button type="button" role="tab" data-mode="video" aria-selected="true">Видео</button>
      <button type="button" role="tab" data-mode="audio" aria-selected="false">Звук</button>
    </div>
    <div class="scale" id="scale" role="radiogroup" aria-label="Качество"></div>
    <p class="hint" id="hint" hidden></p>
    <button class="go" id="go" type="button">Скачать</button>
  </section>

  <section class="list" id="list" hidden>
    <div class="list-head">
      <h2>Загрузки</h2>
      <button class="link" id="clear" type="button">Очистить</button>
    </div>
    <ul id="jobs"></ul>
  </section>

  <footer>
    <button class="folder" id="folder" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.6l1.8 2h6.6a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
      <span id="folderName">Загрузки</span>
    </button>
    <button class="link" id="pick" type="button">Изменить</button>
    <button class="icon" id="gear" type="button" aria-label="Настройки" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm7 3.9v-1.8l-2-.4a5.3 5.3 0 0 0-.6-1.4l1.1-1.7-1.3-1.3-1.7 1.1a5.3 5.3 0 0 0-1.4-.6L10.9 3H9.1l-.4 2a5.3 5.3 0 0 0-1.4.6L5.6 4.5 4.3 5.8l1.1 1.7a5.3 5.3 0 0 0-.6 1.4l-2 .4v1.8l2 .4c.1.5.3 1 .6 1.4l-1.1 1.7 1.3 1.3 1.7-1.1c.4.3.9.5 1.4.6l.4 2h1.8l.4-2c.5-.1 1-.3 1.4-.6l1.7 1.1 1.3-1.3-1.1-1.7c.3-.4.5-.9.6-1.4z"/></svg>
    </button>
  </footer>

  <section class="settings" id="settings" hidden>
    <label for="proxy">Прокси для yt-dlp</label>
    <input id="proxy" type="text" placeholder="socks5://127.0.0.1:1080" spellcheck="false" autocomplete="off">
    <p class="hint">Нужен, только если сайт открывается через VPN-расширение браузера. Системный VPN подхватится сам.</p>
    <div class="ver">
      <span id="ver">yt-dlp</span>
      <button class="link" id="upd" type="button">Обновить</button>
    </div>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
